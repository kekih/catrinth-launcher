name: Build and Release Catrinth Launcher

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: catrinth-launcher.exe
            archive_name: catrinth-launcher-windows-x64.zip
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: catrinth-launcher
            archive_name: catrinth-launcher-linux-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libasound2-dev libudev-dev pkg-config libssl-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Windows Binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" -Destination "${{ matrix.binary }}"
          Compress-Archive -Path "${{ matrix.binary }}", "README.md" -DestinationPath "${{ matrix.archive_name }}"

      - name: Package Linux Binary
        if: runner.os == 'Linux'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} .
          chmod +x ${{ matrix.binary }}
          tar -czvf ${{ matrix.archive_name }} ${{ matrix.binary }} README.md

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-build
          path: |
            catrinth-launcher*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize release assets
        run: |
          mkdir -p dist
          find release-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.exe" \) -exec cp {} dist/ \;
          ls -la dist/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.0' }}
          name: "Catrinth Launcher ${{ github.ref_name != 'main' && github.ref_name || 'v1.0.0' }}"
          body: |
            ## 🚀 Catrinth Minecraft Launcher (Rust Edition)
            
            Современный легковесный лаунчер Minecraft на языке Rust с красивой тёмной темой, интеграцией с прокси Catrinth Hub и встроенным каталогом модов!
            
            ### ✨ Возможности:
            - 🎨 **Красивая тёмная тема** в фирменном стиле Catrinth (Изумрудный + Сапфировый/Фиолетовый акценты).
            - 📦 **Каталог модов и плагинов**: поиск и установка модов напрямую из прокси Catrinth Hub в один клик.
            - 📁 **Выбор папки игры**: легкая смена расположения `.minecraft`.
            - 🧠 **Настройка памяти**: ползунок и пресеты выделения оперативной памяти (от 1 ГБ до 32 ГБ).
            - ☕ **Выбор Java и аргументов JVM**: автоопределение и настройка флагов оптимизации.
            - ⚡ **Максимальное быстродействие**: скомпилирован на чистом Rust, потребляет минимум ресурсов!
            
            ### 📥 Скачать лаунчер:
            - **Windows (x64)**: `catrinth-launcher-windows-x64.zip` (или прямой файл `catrinth-launcher.exe`)
            - **Linux (x64)**: `catrinth-launcher-linux-x64.tar.gz`
          draft: false
          prerelease: false
          files: dist/*
